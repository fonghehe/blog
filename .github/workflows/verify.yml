name: Verify blog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Publish content review summary
        if: always()
        run: |
          if [ -f maintenance/content-quality-report.md ]; then
            cat maintenance/content-quality-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
